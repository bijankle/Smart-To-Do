name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/smart-todo-list-arch-dpf2wq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Assemble static site
        run: |
          mkdir -p _site/src _site/dist
          cp index.html manifest.webmanifest sw.js _site/
          cp -R icons _site/icons
          cp -R src/ui _site/src/ui
          cp -R dist/src _site/dist/src
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
